<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1a1a2e">
<title>夜王反推 · 黑夜君临</title>
<style>
:root{
  --bg:#1a1a2e; --panel:rgba(255,255,255,0.06); --panel2:rgba(255,255,255,0.10); --border:rgba(255,255,255,0.15);
  --gold:#4a90e2; --gold-bright:#7eb8ff; --text:#ffffff; --dim:#a0aec0;
  --danger:#d36a64; --green:#7cb86a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  line-height:1.55;font-size:16px;padding-bottom:64px;}
.wrap{max-width:560px;margin:0 auto;padding:12px 14px;}
header{display:flex;align-items:center;justify-content:space-between;margin:6px 0 10px;}
header h1{font-size:1.2rem;margin:0;color:#ffd700;letter-spacing:.5px;}
header .sub{font-size:.76rem;color:var(--dim);margin:2px 0 0;}
header h1 .h1-avatar{width:2.25em;height:2.25em;border-radius:50%;vertical-align:-.3em;margin-right:8px;object-fit:cover;}
section{margin:14px 0;}
.label{font-size:.78rem;color:var(--dim);margin:0 0 7px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.muted{color:var(--dim);}
.search{position:relative;}
.search input{width:100%;padding:13px 14px;border-radius:11px;border:1px solid var(--border);
  background:var(--panel);color:var(--text);font-size:1rem;outline:none;}
.search input::placeholder{color:#6b5d4d;}
.search input:focus{border-color:var(--gold);}
.dropdown{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--panel2);
  border:1px solid var(--border);border-radius:11px;overflow:hidden;z-index:20;max-height:300px;overflow-y:auto;
  box-shadow:0 8px 24px rgba(0,0,0,.5);}
.dropdown .item{padding:11px 14px;border-bottom:1px solid var(--border);cursor:pointer;}
.dropdown .item:last-child{border-bottom:none;}
.dropdown .item:active{background:var(--panel);}
.dropdown .item b{font-size:.96rem;font-weight:600;}
.dropdown .item .meta{font-size:.72rem;color:var(--dim);margin-top:2px;}
.dropdown .item .meta .ok{color:var(--green);}
.dropdown .empty{padding:16px;color:var(--dim);font-size:.85rem;text-align:center;}
.tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px;}
.tag{padding:8px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--border);
  color:var(--text);font-size:.84rem;cursor:pointer;font-family:inherit;line-height:1;}
.tag:active{transform:scale(.96);}
.tag.sel{background:linear-gradient(45deg,#ffd700,#ffed4e);color:#1a1a2e;font-weight:600;box-shadow:0 4px 15px rgba(255,215,0,0.4);}
.tag.lock{border-color:var(--green);color:var(--green);}
.tag.static{cursor:default;background:var(--bg);}
.tag.static:active{transform:none;}
.result{margin-top:6px;}
.lock-card{background:linear-gradient(135deg,rgba(74,144,226,0.14),rgba(74,144,226,0.04));border:1px solid var(--gold);
  border-radius:14px;padding:18px 16px 16px;text-align:center;box-shadow:0 0 0 1px rgba(74,144,226,.18) inset;}
.lock-card .k{font-size:.78rem;color:var(--dim);letter-spacing:1px;}
.lock-card .v{font-size:1.55rem;color:#ffd700;font-weight:700;margin:7px 0 4px;}
.lock-card .v .id{font-size:.9rem;color:var(--dim);font-weight:400;}
.lock-card .why{font-size:.74rem;color:var(--dim);line-height:1.6;}
.cand{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:10px;}
.cand .top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.cand .nm{font-size:1.05rem;font-weight:600;color:#ffd700;}
.cand .id{font-size:.72rem;color:var(--dim);margin-left:3px;}
.badge{font-size:.66rem;padding:2px 8px;border-radius:999px;border:1px solid var(--border);color:var(--dim);white-space:nowrap;}
.badge.joker{color:var(--danger);border-color:var(--danger);}
.bar{height:8px;background:var(--bg);border-radius:99px;overflow:hidden;margin:9px 0 5px;}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-bright));border-radius:99px;}
.cand .pct{font-size:.76rem;color:var(--dim);}
.cand .pool{font-size:.75rem;color:var(--dim);margin-top:9px;padding-top:9px;border-top:1px dashed var(--border);line-height:1.7;}
.cand .pool b{color:var(--text);font-weight:500;}
.hint{text-align:center;color:var(--dim);font-size:.86rem;padding:34px 12px;line-height:1.8;}
.note{font-size:.74rem;color:var(--dim);margin-top:8px;line-height:1.7;}
.note.warn{color:var(--danger);}
footer{font-size:.7rem;color:var(--dim);text-align:center;margin-top:22px;line-height:1.7;border-top:1px solid var(--border);padding-top:14px;}
.btn-clear{font-size:.74rem;color:var(--dim);background:none;border:none;cursor:pointer;text-decoration:underline;padding:2px 4px;font-family:inherit;}
.btn-reset{font-size:.74rem;color:var(--gold);background:var(--panel);border:1px solid var(--border);
  padding:6px 11px;border-radius:8px;cursor:pointer;font-family:inherit;}
@media(max-width:360px){body{font-size:15px;}.lock-card .v{font-size:1.35rem;}.cand .nm{font-size:1rem;}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1><img src="assets/icons/boss.png" class="h1-avatar" alt="">夜王反推</h1>
      <p class="sub">根据第一夜BOSS，反推可能的夜王</p>
    </div>
    <div style="display:flex;gap:8px">
      <a href="index.html" class="btn-reset" style="text-decoration:none">← 返回</a>
      <button id="reset" class="btn-reset">重置</button>
    </div>
  </header>

  <section>
    <p class="label">① 第一夜 Boss</p>
    <div class="search">
      <input id="q1" type="text" placeholder="搜索：中文名 / 别名 / 拼音首字母（如 jz）" autocomplete="off" autocapitalize="off">
      <div id="dd1" class="dropdown" style="display:none"></div>
    </div>
    <div id="tags1" class="tags"></div>
  </section>

  <section id="sec2" style="display:none">
    <p class="label">② 第二夜 Boss <span class="muted">（可选 → 精确锁定）</span>
      <button id="clr2" class="btn-clear">清除选择</button></p>
    <div id="tags2" class="tags"></div>
  </section>

  <section>
    <p class="label">③ 结果</p>
    <div id="result" class="result"></div>
  </section>

  <footer>
    数据来源：夜王Boss统计与反推.xlsx · 共 520 个种子<br>
    别名基于玩家社区俗称，如有出入可在代码 <b>DATA</b> 区自行增补
  </footer>
</div>

<script>
// ====== 数据（由 Excel 自动生成；别名/拼音首字母在此修改）======
(async () => {
  const res = await fetch('dataset/boss_data.json');
  if(!res.ok) throw new Error('boss_data.json 加载失败: ' + res.status);
  const DATA = await res.json();

const NL = Object.fromEntries(DATA.nightlords.map(n=>[n.id,n]));
const D1 = DATA.day1Bosses, D2 = DATA.day2Bosses, COMBOS = DATA.combos;
const JOKER = 7;

let sel1 = null, sel2 = null;

const $ = id => document.getElementById(id);
const norm = s => String(s||'').toLowerCase().replace(/[\s&·\-_,，。·]/g,'');

function matchBoss(b,q){
  const qq=norm(q); if(!qq) return false;
  if(norm(b.name).includes(qq)) return true;
  if(String(b.id)===qq) return true;
  if((b.pinyin||'').toLowerCase().includes(qq)) return true;
  return (b.aliases||[]).some(a=>norm(a).includes(qq));
}
function getCount(lid){ const h=NL[lid].day1Pool.find(p=>p.id===(sel1&&sel1.id)); return h?h.count:0; }

// ---- 第一夜搜索 ----
const q1=$('q1'), dd1=$('dd1'), tags1=$('tags1');
function renderDd1(){
  const q=q1.value.trim();
  if(!q){ dd1.style.display='none'; return; }
  let list=D1.filter(b=>matchBoss(b,q))
    .sort((a,b)=>(a.locked?-1:0)-(b.locked?-1:0) || a.candidates.length-b.candidates.length)
    .slice(0,8);
  if(!list.length){ dd1.innerHTML='<div class="empty">没找到，试试拼音首字母（如 jz = 接肢）</div>'; dd1.style.display='block'; return; }
  dd1.innerHTML=list.map(b=>{
    const m=b.locked?`<span class="ok">✓ 独占 → ${NL[b.candidates[0]].name}</span>`
                    : `候选 ${b.candidates.length} 个夜王`;
    return `<div class="item" data-id="${b.id}"><b>${b.name}</b><div class="meta">${m}</div></div>`;
  }).join('');
  dd1.style.display='block';
}
q1.addEventListener('input',renderDd1);
q1.addEventListener('focus',function(){this.select();renderDd1();});
dd1.addEventListener('click',e=>{const it=e.target.closest('.item');if(!it)return;const b=D1.find(x=>x.id===it.dataset.id);if(b)select1(b);});
document.addEventListener('click',e=>{if(!e.target.closest('.search'))dd1.style.display='none';});

function renderTags1(){
  tags1.innerHTML=D1.map(b=>{
    const sel=sel1&&sel1.id===b.id;
    return `<button class="tag${sel?' sel':''}${b.locked?' lock':''}" data-id="${b.id}">${b.name}</button>`;
  }).join('');
}
tags1.addEventListener('click',e=>{const t=e.target.closest('.tag');if(!t)return;const b=D1.find(x=>x.id===t.dataset.id);if(b)select1(b);});

function select1(b){
  sel1=b; sel2=null;
  q1.value=b.name; dd1.style.display='none';
  renderTags1(); renderSec2(); renderResult();
  document.querySelector('section:nth-of-type(2)').scrollIntoView({behavior:'smooth',block:'nearest'});
}

// ---- 第二夜 ----
function renderSec2(){
  const sec2=$('sec2'), tags2=$('tags2');
  if(!sel1){sec2.style.display='none';return;}
  sec2.style.display='block';
  const d2ids=new Set();
  Object.keys(COMBOS).forEach(k=>{const[a,c]=k.split('_');if(a===sel1.id)d2ids.add(c);});
  const list=D2.filter(b=>d2ids.has(b.id));
  tags2.innerHTML=list.map(b=>{
    const sel=sel2&&sel2.id===b.id;
    return `<button class="tag${sel?' sel':''}" data-id="${b.id}">${b.name}</button>`;
  }).join('') || '<span class="muted" style="font-size:.8rem">该 Boss 无锁定组合（独占或池过广）</span>';
}
$('tags2').addEventListener('click',e=>{
  const t=e.target.closest('.tag');if(!t)return;
  const b=D2.find(x=>x.id===t.dataset.id); if(!b)return;
  sel2=(sel2&&sel2.id===b.id)?null:b;
  renderSec2();renderResult();
});
$('clr2').addEventListener('click',()=>{sel2=null;renderSec2();renderResult();});
$('result').addEventListener('click',e=>{
  const t=e.target.closest('[data-d2]');if(!t)return;
  const b=D2.find(x=>x.id===t.dataset.d2);if(!b)return;
  sel2=(sel2&&sel2.id===b.id)?null:b;
  renderSec2();renderResult();
  document.querySelector('section:nth-of-type(3)').scrollIntoView({behavior:'smooth',block:'nearest'});
});

// ---- 结果 ----
function pairsFor(day1id,lid){
  const out=[];
  for(const k in COMBOS){const p=k.split('_');if(p[0]!==day1id)continue;
    const hit=COMBOS[k].lords.find(l=>l.id===lid);if(hit)out.push([p[1],hit.count]);}
  out.sort((x,y)=>y[1]-x[1]); return out;
}
function lordCard(lid){
  const nl=NL[lid], joker=lid===JOKER;
  const pairs=pairsFor(sel1.id,lid);
  const tags=pairs.length
    ? pairs.map(([d2id])=>`<button class="tag" data-d2="${d2id}">${(D2.find(x=>x.id===d2id)||{}).name||d2id}</button>`).join('')
    : `<span class="muted">未唯一锁定</span>`;
  return `<div class="cand">
    <div class="top"><div><span class="nm">${nl.name}</span><span class="id">#${nl.id}</span></div>
      ${joker?'<span class="badge joker">⚠ 万金油</span>':''}</div>
    <div class="pool"><b>配对第二夜：</b>${tags}</div>
  </div>`;
}
function lockHTML(k,title,name,lid,why){
  return `<div class="lock-card"><div class="k">${title}</div>
    <div class="v">${name} <span class="id">#${lid}</span></div>
    <div class="why">${why}</div></div>`;
}
function renderResult(){
  const R=$('result');
  if(!sel1){R.innerHTML='<div class="hint">👆 先选择或搜索<br>第一夜 Boss</div>';return;}
  let html='';
  if(sel1.locked){
    const lid=sel1.candidates[0];
    html=lockHTML('k','🎯 锁定夜王',NL[lid].name,lid,`${sel1.name} 是 <b>${NL[lid].name}</b> 独占的第一夜 Boss，可直接判定`);
    html+=secondHint(lid);
    R.innerHTML=html;return;
  }
  if(sel2){
    const key=`${sel1.id}_${sel2.id}`;
    const cb=COMBOS[key];
    if(cb){
      if(cb.lords.length===1){
        const lid=cb.lords[0].id;
        html=lockHTML('k','🎯 组合锁定夜王',NL[lid].name,lid,`${sel1.name} + ${sel2.name} 唯一对应 <b>${NL[lid].name}</b>（共 ${cb.seeds} 个种子）`);
        html+=secondHint(lid,true);
        R.innerHTML=html;return;
      }
      // 该组合对应多个夜王（歧义）：按种子数精确列出每个候选及占比
      const lords=cb.lords.slice().sort((a,b)=>b.count-a.count);
      html=`<p class="label" style="margin-top:0">「${sel1.name} + ${sel2.name}」可能对应这些夜王（共 ${cb.seeds} 个种子）：</p>`;
      html+=lords.map(l=>{
        const pct=Math.round(l.count*100/cb.seeds);
        const joker=l.id===JOKER?'<span class="badge joker">⚠ 万金油</span>':'';
        return `<div class="cand"><div class="top"><div><span class="nm">${NL[l.id].name}</span><span class="id">#${l.id}</span> ${joker}</div></div>
          <div class="pool"><b>${l.count} 个种子</b>（约 ${pct}%）</div></div>`;
      }).join('');
      if(lords.some(l=>l.id===JOKER))
        html+=`<p class="note warn">⚠ 黑夜王(#7) Boss 池最广，常混入候选——可再结合 POI 进一步排除。</p>`;
      R.innerHTML=html;return;
    }
    R.innerHTML='<div class="hint">该组合无数据<br>请核对 Boss 选择</div>';return;
  }
  const cands=sel1.candidates.slice();
  cands.sort((a,b)=>getCount(b)-getCount(a));
  html=`<p class="label" style="margin-top:0">看到「${sel1.name}」时，可能是这些夜王：</p>`;
  html+=cands.map(id=>lordCard(id)).join('');
  if(cands.includes(JOKER))
    html+=`<p class="note warn">⚠ 黑夜王(#7) 是终极夜王，Boss 池最广，几乎总在候选里——单凭第一夜难以排除，建议结合第二夜精确锁定。</p>`;
  R.innerHTML=html;
}
function secondHint(lid,fromCombo){
  if(fromCombo) return '';
  const nl=NL[lid];
  const pairs=pairsFor(sel1.id,lid);
  const head=pairs.length?`该夜王在「${sel1.name}」下的第二夜（点击可填入第二夜）`:'该夜王第二夜可能遇到的 Boss（全局参考）';
  const tags=pairs.length
    ? pairs.map(([d2id])=>`<button class="tag" data-d2="${d2id}">${(D2.find(x=>x.id===d2id)||{}).name||d2id}</button>`).join('')
    : nl.day2Pool.slice(0,6).map(p=>`<span class="tag static">${p.name}</span>`).join('');
  return `<div style="margin-top:12px"><div class="label">${head}</div><div class="tags">${tags}</div></div>`;
}

$('reset').addEventListener('click',()=>{sel1=null;sel2=null;q1.value='';dd1.style.display='none';renderTags1();renderSec2();renderResult();});
renderTags1();renderResult();
})();
</script>
